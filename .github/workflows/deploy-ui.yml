# Deploys only the Vite app in ui/ to Vercel (not the Python backend).
#
# Prerequisites (one-time):
# - GitHub repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#   (from Vercel → Project → Settings → General, or run `vercel link` in ui/ and read .vercel/project.json)
# - Vercel project must use this repo with Root Directory = "ui" OR be linked from ui/ so builds run there.
# - If the Vercel GitHub integration also auto-deploys this repo, disable it or you may get double deploys.

name: Deploy UI to Vercel

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

defaults:
  run:
    working-directory: ui

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
