services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jubilee-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./datasets:/app/datasets
      - ./trained_models:/app/trained_models
    restart: unless-stopped

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: jubilee-ui
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped
