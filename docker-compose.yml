services:
  redis:
    image: redis:7-alpine
    container_name: jubilee-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: jubilee-backend
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./datasets:/app/datasets
      - ./trained_models:/app/trained_models
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: jubilee-celery-worker
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    command: celery -A backend.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - ./datasets:/app/datasets
      - ./trained_models:/app/trained_models
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: jubilee-ui
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped

  mcp-server:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: jubilee-mcp
    env_file:
      - .env
    environment:
      - START_COMMAND=python -m mcp_server
      - PORT=8080
      - PYTHONPATH=/app:/app/tools/data-tools:/app/tools/models-tools/training
    ports:
      - "8080:8080"
    volumes:
      - ./datasets:/app/datasets
      - ./trained_models:/app/trained_models
    profiles:
      - mcp
    restart: unless-stopped

volumes:
  redis_data:
